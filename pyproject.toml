[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qanat"
version = "0.1.0"
description = "Configurable hydrogeospatial terrain and groundwater investigation platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.7,<3",
  "streamlit>=1.36,<2",
]

[project.optional-dependencies]
geo = [
  "numpy>=1.26,<3",
  "rasterio>=1.3,<2",
  "pyproj>=3.6,<4",
  "shapely>=2.0,<3",
  "scipy>=1.12,<2",
  "pandas>=2.1,<3",
  "matplotlib>=3.8,<4",
]
groundwater = [
  "flopy>=3.9,<4",
]
hydrology = [
  "pywatershed>=2.0,<3",
]
test = [
  "pytest>=8,<9",
]

[project.scripts]
qanat = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*", "qanat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
